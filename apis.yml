name: Novoic
description: >-
  Novoic is a London-based clinical AI company building speech biomarkers for
  the early detection of Alzheimer's disease and cognitive impairment. Its
  technology analyzes how people speak - acoustic and linguistic patterns - to
  screen for subtle cognitive change in about ten minutes on any smart device.
  Products include Storyteller (automated, browser-based speech-based cognitive
  testing), Dashboard (an enterprise platform for running screening programs
  across sites with AI-assisted triage and analytics), and a Speech API for
  direct access to their speech processing, automated speech recognition,
  quality control, and speech-biomarker models. Novoic is deployed across 50+
  medical institutions, partners with the Alzheimer's Disease Neuroimaging
  Initiative, and emphasizes HIPAA/GDPR compliance. It also publishes two
  open-source feature-extraction libraries, surfboard (audio) and blabla
  (linguistics).
